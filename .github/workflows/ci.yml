name: CI

on:
  push: # every push, every branch
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (black, isort, flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install linters
        run: pip install black isort flake8
      - run: black --check --diff .
      - run: isort --check-only --diff .
      - run: flake8 .

  test:
    name: Tests (pytest, real Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # requirements-dev.txt deliberately excludes torch / sentence-transformers:
      # tests use deterministic fake embeddings and a mocked Groq endpoint, so
      # no model download, API key or network access is needed.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -ra

  docker:
    name: Docker image (build + smoke test)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: support-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test - runs as non-root and the app imports cleanly
        run: |
          test "$(docker run --rm --entrypoint id support-agent:ci -u)" = "10001"
          docker run --rm \
            -e LLM_API_KEY=ci-placeholder \
            -e DATABASE_URL=postgresql://u:p@localhost:5432/d \
            --entrypoint python support-agent:ci \
            -c "import api.main, worker.tasks; print('imports ok')"
